name: Build SensaBridge Firmware

on:
  push:
    paths:
      - "firmware/**"
      - ".github/workflows/build-firmware.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PICO_SDK_REF: "2.3.0"
      TINYUSB_REF: "2d56dc533e45e4e91b15e93fdab5e22e964f328d"
      ARM_TOOLCHAIN_VERSION: "15.2.rel1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build xz-utils curl python3

      - name: Cache Arm GNU Toolchain
        id: cache-arm-toolchain
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/arm-gnu-toolchain
          key: arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-${{ runner.arch }}

      - name: Install Arm GNU Toolchain
        if: steps.cache-arm-toolchain.outputs.cache-hit != 'true'
        run: |
          ARCH="${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}"
          TARBALL="arm-gnu-toolchain-${ARM_TOOLCHAIN_VERSION}-${ARCH}-arm-none-eabi.tar.xz"
          curl -fL "https://developer.arm.com/-/media/Files/downloads/gnu/${ARM_TOOLCHAIN_VERSION}/binrel/${TARBALL}" -o "/tmp/${TARBALL}"
          mkdir -p "${{ runner.temp }}/arm-gnu-toolchain"
          tar -xf "/tmp/${TARBALL}" -C "${{ runner.temp }}/arm-gnu-toolchain" --strip-components=1
          rm -f "/tmp/${TARBALL}"

      - name: Cache Pico SDK and TinyUSB
        id: cache-pico-sdk
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/pico-sdk
            ${{ runner.temp }}/tinyusb
          key: pico-sdk-${{ env.PICO_SDK_REF }}-tinyusb-${{ env.TINYUSB_REF }}-btstack-cyw43-lwip-v2

      - name: Checkout Pico SDK and TinyUSB
        if: steps.cache-pico-sdk.outputs.cache-hit != 'true'
        run: |
          rm -rf "${{ runner.temp }}/pico-sdk" "${{ runner.temp }}/tinyusb"
          git clone --depth 1 --branch "${{ env.PICO_SDK_REF }}" https://github.com/raspberrypi/pico-sdk.git "${{ runner.temp }}/pico-sdk"
          git -C "${{ runner.temp }}/pico-sdk" submodule update --init --depth 1 lib/btstack lib/cyw43-driver lib/lwip
          git clone https://github.com/hathach/tinyusb.git "${{ runner.temp }}/tinyusb"
          git -C "${{ runner.temp }}/tinyusb" checkout "${{ env.TINYUSB_REF }}"

      - name: Configure and build SensaBridge (pico2_w)
        run: |
          export PATH="${{ runner.temp }}/arm-gnu-toolchain/bin:$PATH"
          cmake -S firmware -B build -G Ninja \
            -DPICO_SDK_PATH="${{ runner.temp }}/pico-sdk" \
            -DPICO_TINYUSB_PATH="${{ runner.temp }}/tinyusb" \
            -DPICO_BOARD=pico2_w \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          arm-none-eabi-size build/sensa-bridge.elf
          mkdir -p dist
          cp build/sensa-bridge.uf2 dist/SensaBridge.uf2

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: sensa-bridge-pico2_w
          path: dist/*.uf2
